name: recipehub
description: A recipe management application built with Flutter
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^0.13.5
  
  # Local Storage
  shared_preferences: ^2.0.15
  
  # State Management
  provider: ^6.0.0
  
  # Image Picker
  image_picker: ^0.8.5+1
  
  # Intl (Date & Time formatting)
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true